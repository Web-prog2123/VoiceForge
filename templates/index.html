<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceForge — Turn Your Text Into Real Voice</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Висувна бічна панель (Sidebar) -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-wave-square logo-icon"></i>
            <span class="logo-text">VoiceForge</span>
        </div>
        <nav class="nav-menu">
            <a href="#" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span class="link-text">Home</span>
            </a>
            <a href="#studio" class="nav-item">
                <i class="fa-solid fa-bars-staggered"></i>
                <span class="link-text">Voice</span>
            </a>
            <a href="#studio" class="nav-item">
                <i class="fa-solid fa-file-lines"></i>
                <span class="link-text">Text</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-gear"></i>
                <span class="link-text">Settings</span>
            </a>
        </nav>
    </aside>

    <!-- Основний контент -->
    <main class="main-content">
        <section class="hero-section">
            <div class="hero-text">
                <h1>Turn Your Text <br><span class="gradient-text">Into Real Voice</span></h1>
                <p>Natural-sounding AI voices that bring your text to life. Fast, easy, and built for creators, businesses and everyone who wants to be heard.</p>
                <a href="#studio" class="btn-primary"><i class="fa-solid fa-play"></i> Get Started</a>
            </div>
            <div class="hero-visual">
                <div class="neon-wave"></div>
            </div>
        </section>

        <!-- Студія генерації -->
        <section id="studio" class="studio-section">
            <div class="glass-card">
                <h2>AI Voice Studio</h2>
                <form id="voice-form">
                    <div class="form-group">
                        <label for="text">Script / Text (English)</label>
                        <textarea id="text" name="text" rows="6" placeholder="Paste your text here..." required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="voice">Select AI Voice</label>
                            <select id="voice" name="voice">
                                {% for key, val in voices.items() %}
                                    <option value="{{ key }}">{{ val }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="speed">Speech Speed: <span id="speed-val">1.0</span>x</label>
                            <input type="range" id="speed" name="speed" min="0.7" max="1.3" step="0.05" value="1.0">
                        </div>
                    </div>

                    <button type="submit" class="btn-primary btn-block" id="submit-btn">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Voiceover
                    </button>
                </form>

                <div id="status-box" class="status-box hidden"></div>

                <div id="audio-result" class="audio-result hidden">
                    <h3>Generated Audio</h3>
                    <audio id="audio-player" controls></audio>
                    <a id="download-btn" class="btn-secondary" download="voiceover.wav">Download WAV</a>
                </div>
            </div>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
